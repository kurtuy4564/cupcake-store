version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cupcake-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pass12345     # поменяй на свой сложный пароль
      POSTGRES_DB: cupcake_store
    ports:
      - "5432:5432"                       # порт на твоём компьютере
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: